spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/banking-system
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC
    open-in-view: false
  liquibase:
    change-log: classpath:liquibase/master.xml
    default-schema: public

server:
  port: 8080

banking:
  jwt:
    secret: change-me-in-production-this-must-be-at-least-32-bytes-long-secret-key
    expiration-minutes: 60
